<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="config.js"></script>
    <style>
        :root {
            --button-spacing: 10px;
            --button-vertical-offset: 0px;
            --speech-duration: 8;
            --auto-speak-interval: 30000;
            --auto-speak-probability: 0.0;
            --speech-spacing: 10px;
            --input-opacity: 0.9;
            --gif-switch-interval: 60000;
            --gif-temp-duration: 10000;
            --gif-flip-probability: 0.0;
            --clock-opacity: 0.0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: transparent;
            overflow: hidden;
            -webkit-app-region: no-drag;
            cursor: default;


        }

        .pet-container {
            padding: 0;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: var(--button-spacing);
        }

        .pet-body {
            background: transparent;
            padding: 0;
            border-radius: 10px;
            border: none;
            box-shadow: none;
            -webkit-app-region: drag;
            display: inline-block;
        }

        .pet-body img {
            width: var(--pet-width);
            height: var(--pet-height);
            object-fit: contain;
            display: block;
            transition: opacity 0.5s;
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: auto;
        }

        .pet-body img.fade-out {
            opacity: 0;
        }

        .pet-body img.flip-x {
            transform: scaleX(-1);
        }

        .speech {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 260px;
            white-space: normal;
            word-wrap: break-word;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid #999;
            z-index: 100;
            margin-right: var(--speech-spacing);
            -webkit-app-region: no-drag;
        }

        .speech.show {
            opacity: 1;
        }

        .close-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            -webkit-app-region: no-drag;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .pet-body:hover~.close-btn,
        .close-btn:hover {
            opacity: 1;
        }

        .speak-btn {
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 4px;
            font-size: 20px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: opacity 0.4s;
        }

        .speak-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .input-group,
        .affection-display,
        .clock-display,
        .button-group {
            -webkit-app-region: no-drag;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            transition: opacity 0.4s;
        }

        .input-box {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 12px;
            background: rgba(255, 255, 255, var(--input-opacity));
            -webkit-app-region: no-drag;
        }

        .send-btn {
            padding: 4px 8px;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 12px;
            background: rgba(255, 255, 255, var(--input-opacity));
            cursor: pointer;
            white-space: nowrap;
        }

        .affection-display {
            font-size: 12px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
            margin-top: 5px;
        }

        .clock-display {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, var(--clock-opacity));
            padding: 4px 10px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-top: var(--button-vertical-offset);
        }

        body.is-wandering .input-group,
        body.is-wandering .affection-display,
        body.is-wandering .clock-display,
        body.is-wandering .speak-btn {
            opacity: 0;
            pointer-events: none;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            display: none;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 200;
            -webkit-app-region: no-drag;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px 18px;
            width: 340px;
            max-height: 290px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #ccc;
        }

        .settings-item {
            margin-bottom: 8px;
        }

        .settings-item>div {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #555;
        }

        .settings-item>div span {
            font-weight: bold;
            color: #333;
            min-width: 52px;
            text-align: right;
        }

        .settings-item input[type="range"] {
            width: 100%;
            margin-top: 2px;
            accent-color: #555;
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .settings-buttons button {
            padding: 5px 20px;
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.95);
        }

        .settings-buttons button:hover {
            background: rgba(220, 220, 220, 0.95);
        }
    </style>
</head>

<body>
    <div class="pet-container">
        <div class="speech" id="speech"></div>
        <div>
            <div class="clock-display" id="clockDisplay">00:00:00</div>
            <div class="pet-body"><img src="" alt="Pickle" id="petGif" draggable="false"></div>
            <div class="input-group">
                <input type="text" class="input-box" id="inputBox" placeholder="输入消息...">
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
            <div class="affection-display"><span id="affectionLevel">LV.50</span></div>
        </div>
        <div class="button-group">
            <button class="close-btn" onclick="window.close()">×</button>
            <button class="speak-btn" onclick="speak()">💬</button>
            <button class="speak-btn" id="wanderBtn" onclick="toggleWander()">🚶</button>
            <button class="speak-btn" id="settingsBtn" onclick="openSettings()">⚙</button>
        </div>
    </div>
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <h3>⚙ 设置</h3>
            <div class="settings-item">
                <div>气泡停留 <span id="valSpeechDuration">8s</span></div><input type="range" min="1" max="60"
                    id="setSpeechDuration">
            </div>
            <div class="settings-item">
                <div>自动说话间隔 <span id="valAutoSpeakInterval">30s</span></div><input type="range" min="5000" max="300000"
                    step="5000" id="setAutoSpeakInterval">
            </div>
            <div class="settings-item">
                <div>说话概率 <span id="valAutoSpeakProbability">0.00</span></div><input type="range" min="0" max="1"
                    step="0.05" id="setAutoSpeakProbability">
            </div>
            <div class="settings-item">
                <div>GIF切换间隔 <span id="valGifSwitchInterval">60s</span></div><input type="range" min="10000"
                    max="300000" step="5000" id="setGifSwitchInterval">
            </div>
            <div class="settings-item">
                <div>临时GIF保持 <span id="valGifTempDuration">10s</span></div><input type="range" min="5000" max="60000"
                    step="1000" id="setGifTempDuration">
            </div>
            <div class="settings-item">
                <div>Provider</div><select id="setProvider">
                    <option value="minimax">MiniMax</option>
                    <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
                    <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                </select>
            </div>
            <div class="settings-item">
                <div>API Key</div><input type="password" id="setApiKey" placeholder="覆盖默认 key">
            </div>
            <div class="settings-buttons"><button onclick="saveAndCloseSettings()">保存</button><button
                    onclick="closeSettings()">取消</button></div>
            <div><button onclick="clearChatHistory()">清空聊天记录</button><span id="clearChatMsg"
                    style="display:none;"></span></div>
        </div>
    </div>
    <script src="messages.js"></script>
    <script src="gifs.js"></script>
    <script>
        // 原有初始化代码不变（documentElement 样式、获取元素等）
        document.documentElement.style.setProperty('--pet-width', config.petWidth + 'px');
        document.documentElement.style.setProperty('--pet-height', config.petHeight + 'px');

        const speech = document.getElementById('speech');
        const petGif = document.getElementById('petGif');
        const affectionDisplay = document.getElementById('affectionLevel');
        const { ipcRenderer } = require('electron');

        petGif.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });

        const rootStyle = getComputedStyle(document.documentElement);
        const gifFlipProbability = parseFloat(rootStyle.getPropertyValue('--gif-flip-probability'));
        let settings = {
            speechDuration: parseInt(rootStyle.getPropertyValue('--speech-duration')),
            autoSpeakInterval: parseInt(rootStyle.getPropertyValue('--auto-speak-interval')),
            autoSpeakProbability: parseFloat(rootStyle.getPropertyValue('--auto-speak-probability')),
            gifSwitchInterval: parseInt(rootStyle.getPropertyValue('--gif-switch-interval')),
            gifTempDuration: parseInt(rootStyle.getPropertyValue('--gif-temp-duration')),
            provider: 'deepseek-v4-flash',
            apiKey: ''
        };

        async function loadSettings() {
            try {
                const s = await ipcRenderer.invoke('load-settings');
                applySettings(s);
            } catch (e) { console.error('loadSettings error:', e); }
        }
        loadSettings();

        function applySettings(s) {
            Object.assign(settings, s);
            document.documentElement.style.setProperty('--speech-duration', s.speechDuration);
            document.documentElement.style.setProperty('--auto-speak-interval', s.autoSpeakInterval);
            document.documentElement.style.setProperty('--auto-speak-probability', s.autoSpeakProbability);
            document.documentElement.style.setProperty('--gif-switch-interval', s.gifSwitchInterval);
            document.documentElement.style.setProperty('--gif-temp-duration', s.gifTempDuration);
            restartAutoSpeak();
        }

        async function saveSettingsToFile() {
            return ipcRenderer.invoke('save-settings', { ...settings });
        }

        const fs = require('fs');
        const path = require('path');
        let AFFECTION_FILE = null;
        const maxAffection = config.maxAffection;

        function loadAffection() {
            if (!AFFECTION_FILE) return config.affection;
            try {
                if (fs.existsSync(AFFECTION_FILE)) {
                    const data = JSON.parse(fs.readFileSync(AFFECTION_FILE, 'utf-8'));
                    return typeof data.affection === 'number' ? data.affection : config.affection;
                }
            } catch (e) { }
            return config.affection;
        }

        function saveAffection() {
            if (!AFFECTION_FILE) return;
            try {
                fs.writeFileSync(AFFECTION_FILE, JSON.stringify({ affection }), 'utf-8');
            } catch (e) {
                console.error('saveAffection 失败:', e);
            }
        }

        let affection = config.affection;

        async function initAffection() {
            try {
                const userDataDir = await ipcRenderer.invoke('get-user-data-dir');
                AFFECTION_FILE = path.join(userDataDir, 'affection.json');
                affection = loadAffection();
                saveAffection();
                updateAffectionDisplay();
            } catch (e) { }
        }
        initAffection();

        function updateAffectionDisplay() {
            affectionDisplay.textContent = `LV.${Math.round(affection)}`;
        }

        function changeAffection(delta) {
            affection = Math.max(0, Math.min(maxAffection, affection + delta / 10));
            updateAffectionDisplay();
            saveAffection();
        }

        function switchToTempGif() {
            if (gifs.length === 0 || isWandering) return;
            petGif.classList.add('fade-out');
            setTimeout(() => {
                if (isWandering) { petGif.classList.remove('fade-out'); return; }
                const tempGif = gifs[Math.floor(Math.random() * gifs.length)];
                petGif.src = tempGif;
                // 随机翻转（使用 style.transform）
                if (Math.random() < gifFlipProbability) {
                    petGif.style.transform = 'scaleX(-1)';
                } else {
                    petGif.style.transform = 'scaleX(1)';
                }
                petGif.classList.remove('fade-out');
                setTimeout(switchToResidentGif, settings.gifTempDuration);
            }, 500);
        }

        function switchToResidentGif() {
            if (isWandering) return;
            if (petGif.src.includes('流萤_小熊猫_躺')) return;
            petGif.classList.add('fade-out');
            setTimeout(() => {
                if (isWandering) { petGif.classList.remove('fade-out'); return; }
                petGif.src = residentGif;
                if (Math.random() < gifFlipProbability) {
                    petGif.style.transform = 'scaleX(-1)';
                } else {
                    petGif.style.transform = 'scaleX(1)';
                }
                petGif.classList.remove('fade-out');
                setTimeout(switchToTempGif, settings.gifSwitchInterval);
            }, 500);
        }

        petGif.src = residentGif;
        setTimeout(switchToTempGif, settings.gifSwitchInterval);

        let isDraggingFlag = false;
        let mouseDownX = 0, mouseDownY = 0;

        document.body.addEventListener('mousedown', (e) => {
            // isDraggingFlag = false;
            mouseDownScreenX = e.screenX;
            mouseDownScreenY = e.screenY;
        });

        document.body.addEventListener('mouseup', (e) => {
            const dx = Math.abs(e.screenX - mouseDownScreenX);
            const dy = Math.abs(e.screenY - mouseDownScreenY);
            if (dx < 5 && dy < 5) {
                // 获取鼠标位置的元素（当前）
                const elem = document.elementsFromPoint(e.clientX, e.clientY)[0];
                if (elem && elem.closest && elem.closest('.pet-body')) {
                    if (isWandering) {
                        toggleWander();
                    } else {
                        speak();
                    }
                }
            }
        });

        let speechTimer = null;
        function showSpeech(text, duration) {
            clearTimeout(speechTimer);
            speech.textContent = text;
            speech.classList.add('show');
            if (duration) {
                speechTimer = setTimeout(() => speech.classList.remove('show'), duration);
            }
        }

        async function speak() {
            const msg = messages[Math.floor(Math.random() * messages.length)];
            showSpeech('...', null);
            try {
                const result = await ipcRenderer.invoke('polish-message', msg);
                showSpeech(result.text || msg, settings.speechDuration * 1000);
            } catch (err) {
                showSpeech(msg, settings.speechDuration * 1000);
            }
        }

        async function sendMessage() {
            const inputBox = document.getElementById('inputBox');
            if (inputBox.value.trim()) {
                const userInput = inputBox.value.trim();
                if (userInput.toLowerCase() === '/reset') {
                    inputBox.value = '';
                    showSpeech('正在清除对话历史...', null);
                    try {
                        const result = await ipcRenderer.invoke('chat-message', userInput);
                        showSpeech(result.text || '已清除', settings.speechDuration * 1000);
                    } catch (err) {
                        showSpeech('流萤掉线了: ' + err.message, settings.speechDuration * 1000);
                    }
                    return;
                }
                showSpeech('...', null);
                inputBox.value = '';
                try {
                    const result = await ipcRenderer.invoke('chat-message', userInput);
                    showSpeech(result.text || '流萤没有回复', settings.speechDuration * 1000);
                } catch (err) {
                    showSpeech('流萤掉线了: ' + err.message, settings.speechDuration * 1000);
                }
            }
        }

        window.addEventListener('load', () => {
            updateAffectionDisplay();
            showSpeech('嗨~又见面啦，开拓者！', settings.speechDuration * 1000);
            updateClock();
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);

        let autoSpeakTimer = null;
        function restartAutoSpeak() {
            if (autoSpeakTimer) clearInterval(autoSpeakTimer);
            autoSpeakTimer = setInterval(() => {
                if (!isWandering && Math.random() < settings.autoSpeakProbability) speak();
            }, settings.autoSpeakInterval);
        }
        restartAutoSpeak();

        const inputBoxElem = document.getElementById('inputBox');
        inputBoxElem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && inputBoxElem.value.trim()) {
                sendMessage();
            }
        });

        let isWandering = false;
        let pendingDirection = null;   // 暂存方向
        // 应用方向的函数（独立，不依赖 isWandering 检查？注意内部仍会检查）
        function applyDirection(dir) {
            if (!isWandering) {
                // 如果还未进入行走模式，暂存方向
                pendingDirection = dir;
                return;
            }
            if (dir === 'right') {
                petGif.style.transform = 'scaleX(-1)';
            } else if (dir === 'left') {
                petGif.style.transform = 'scaleX(1)';
            }
            pendingDirection = null;
        }

        ipcRenderer.on('wander-auto-stopped', () => {
            isWandering = false;
            pendingDirection = null;   // 新增：清空暂存的方向
            document.getElementById('wanderBtn').style.background = '';
            document.body.classList.remove('is-wandering');
            const petBody = document.querySelector('.pet-body');
            if (petBody) petBody.style.webkitAppRegion = 'drag';
            petGif.style.transform = 'scaleX(1)';   // 重置翻转
            petGif.classList.add('fade-out');
            setTimeout(() => {
                petGif.src = residentGif;
                petGif.classList.remove('fade-out');
                petGif.style.transform = 'scaleX(1)';
            }, 500);
        });

        // ========== 关键修改：直接操作 transform，不依赖类 ==========
        // 方向事件监听
        ipcRenderer.on('wander-direction', (event, dir) => {
            console.log('[方向事件]', dir, 'isWandering:', isWandering);
            applyDirection(dir);
        });

        ipcRenderer.on('affection-update', (event, delta) => {
            if (delta !== 0) changeAffection(delta);
        });

        // 发送图片偏移量
        function sendImageOffset() {
            const petBody = document.querySelector('.pet-body');
            if (!petBody) return;
            const rect = petBody.getBoundingClientRect();
            ipcRenderer.send('set-image-offset', rect.left, rect.top);

        }

        window.addEventListener('load', () => sendImageOffset());
        window.addEventListener('resize', () => sendImageOffset());



        // 统一的 toggleWander 函数（已整合 sendImageOffset，删除冗余覆盖）
        async function toggleWander() {
            sendImageOffset();
            const result = await ipcRenderer.invoke('toggle-wander');
            const newWandering = result.wandering;
            if (newWandering === isWandering) return;

            isWandering = newWandering;
            const wanderBtn = document.getElementById('wanderBtn');
            const petBody = document.querySelector('.pet-body');

            if (isWandering) {
                // 启动行走
                petGif.style.transform = 'scaleX(1)';
                wanderBtn.style.background = 'rgba(100,180,255,0.25)';
                petBody.style.webkitAppRegion = 'no-drag';
                document.body.classList.add('is-wandering');
                petGif.classList.add('fade-out');
                setTimeout(() => {
                    const newGif = wanderGifs[Math.floor(Math.random() * wanderGifs.length)];
                    petGif.src = newGif;
                    petGif.classList.remove('fade-out');
                    // 行走GIF加载完成后，如果有暂存的方向，应用它
                    if (pendingDirection !== null) {
                        applyDirection(pendingDirection);
                    }
                }, 500);
            } else {
                // 停止行走
                petGif.style.transform = 'scaleX(1)';
                pendingDirection = null;
                wanderBtn.style.background = '';
                petBody.style.webkitAppRegion = 'drag';
                document.body.classList.remove('is-wandering');
                petGif.classList.add('fade-out');
                setTimeout(() => {
                    petGif.src = residentGif;
                    petGif.classList.remove('fade-out');
                    petGif.style.transform = 'scaleX(1)';
                }, 500);
            }

            // 重要：状态更新后，立刻检查是否有暂存的方向（可能在状态变更前已经收到方向事件）
            if (isWandering && pendingDirection !== null) {
                applyDirection(pendingDirection);
            }
        }

        // 设置面板函数（保持不变）
        function openSettings() {
            if (isWandering) return;
            const ov = document.getElementById('settingsOverlay');
            document.getElementById('setSpeechDuration').value = settings.speechDuration;
            document.getElementById('valSpeechDuration').textContent = settings.speechDuration + 's';
            document.getElementById('setAutoSpeakInterval').value = settings.autoSpeakInterval;
            document.getElementById('valAutoSpeakInterval').textContent = (settings.autoSpeakInterval / 1000).toFixed(0) + 's';
            document.getElementById('setAutoSpeakProbability').value = settings.autoSpeakProbability;
            document.getElementById('valAutoSpeakProbability').textContent = settings.autoSpeakProbability.toFixed(2);
            document.getElementById('setGifSwitchInterval').value = settings.gifSwitchInterval;
            document.getElementById('valGifSwitchInterval').textContent = (settings.gifSwitchInterval / 1000).toFixed(0) + 's';
            document.getElementById('setGifTempDuration').value = settings.gifTempDuration;
            document.getElementById('valGifTempDuration').textContent = (settings.gifTempDuration / 1000).toFixed(0) + 's';
            document.getElementById('setProvider').value = settings.provider;
            document.getElementById('setApiKey').value = settings.apiKey;
            bindSettingsSliders();
            ov.classList.add('show');
            ov.onclick = function (e) { if (e.target === ov) closeSettings(); };
            ov.addEventListener('mousedown', function (e) { e.stopPropagation(); });
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function bindSettingsSliders() {
            document.getElementById('setSpeechDuration').oninput = function () {
                document.getElementById('valSpeechDuration').textContent = this.value + 's';
            };
            document.getElementById('setAutoSpeakInterval').oninput = function () {
                document.getElementById('valAutoSpeakInterval').textContent = (this.value / 1000).toFixed(0) + 's';
            };
            document.getElementById('setAutoSpeakProbability').oninput = function () {
                document.getElementById('valAutoSpeakProbability').textContent = parseFloat(this.value).toFixed(2);
            };
            document.getElementById('setGifSwitchInterval').oninput = function () {
                document.getElementById('valGifSwitchInterval').textContent = (this.value / 1000).toFixed(0) + 's';
            };
            document.getElementById('setGifTempDuration').oninput = function () {
                document.getElementById('valGifTempDuration').textContent = (this.value / 1000).toFixed(0) + 's';
            };
        }

        async function saveAndCloseSettings() {
            const newSettings = {
                speechDuration: parseInt(document.getElementById('setSpeechDuration').value),
                autoSpeakInterval: parseInt(document.getElementById('setAutoSpeakInterval').value),
                autoSpeakProbability: parseFloat(document.getElementById('setAutoSpeakProbability').value),
                gifSwitchInterval: parseInt(document.getElementById('setGifSwitchInterval').value),
                gifTempDuration: parseInt(document.getElementById('setGifTempDuration').value),
                provider: document.getElementById('setProvider').value,
                apiKey: document.getElementById('setApiKey').value.trim()
            };
            applySettings(newSettings);
            await saveSettingsToFile();
            closeSettings();
        }

        async function clearChatHistory() {
            const result = await ipcRenderer.invoke('reset-chat');
            const msg = document.getElementById('clearChatMsg');
            msg.style.display = 'inline';
            msg.textContent = result.ok ? '已清空' : '失败';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        }

        document.addEventListener('contextmenu', function (e) {
            if (!e.target.closest('.pet-body')) return;
            if (e.target.closest('.button-group, .input-group, .settings-overlay')) return;
            e.preventDefault();
            if (!isWandering) openSettings();
        });
    </script>
</body>

</html>
